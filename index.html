<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Minh họa Thuật toán Euler Cycle</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #e2e8f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Nunito Sans', sans-serif; 
        }
        
        .slide { 
            width: 1280px; 
            height: 720px; 
            background: white; 
            display: flex; 
            flex-direction: column; 
            padding: 30px 40px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            overflow: hidden; 
            position: relative;
        }
        
        h1 { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 38px; 
            color: #1e293b; 
            border-bottom: 3px solid #4f46e5; 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
        }
        
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        /* CỘT 1: ĐỒ THỊ */
        .panel {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #e2e8f0;
        }

        .panel-title {
            font-weight: 700;
            font-size: 20px;
            color: #4f46e5;
            margin-bottom: 15px;
        }

        /* CỘT 2: TRẠNG THÁI & DIỄN GIẢI */
        .info-panel {
            justify-content: flex-start;
            text-align: left;
        }
        .step-desc {
            font-size: 22px;
            line-height: 1.5;
            color: #334155;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            border-left: 5px solid #4f46e5;
            width: 100%;
        }

        /* CỘT 3: STACK & CE */
        .data-panel {
            gap: 20px;
        }

        /* STACK VISUAL */
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            width: 120px;
            border: 3px solid #1e293b;
            border-top: none;
            padding: 5px;
            min-height: 250px;
            background: #fff;
        }
        .stack-item {
            height: 40px;
            background: #4f46e5;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 4px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 20px;
        }

        /* CE VISUAL */
        .ce-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .ce-item {
            width: 45px;
            height: 45px;
            background: #10b981;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 20px;
        }

        /* ĐIỀU KHIỂN */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: #4f46e5;
            color: white;
            transition: 0.2s;
        }
        button:hover { background: #3730a3; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* SVG STYLING */
        .node { fill: #fff; stroke: #1e293b; stroke-width: 3; }
        .node.active { fill: #fde047; stroke: #4f46e5; stroke-width: 5; }
        .edge { stroke: #94a3b8; stroke-width: 4; }
        .edge.removed { stroke: #e2e8f0; stroke-dasharray: 5,5; }
        .node-text { font-weight: bold; font-size: 20px; text-anchor: middle; dominant-baseline: central; }
    </style>
</head>
<body>

<div class="slide">
    <h1>Minh họa Thuật toán Euler Cycle: Đồ thị 4 đỉnh bậc 2</h1>
    
    <div class="layout">
        <div class="panel">
            <div class="panel-title">Trạng thái đồ thị</div>
            <svg viewBox="0 0 400 400" width="300" height="300" id="graph-svg">
                <line id="e12" x1="100" y1="100" x2="300" y2="100" class="edge" />
                <line id="e23" x1="300" y1="100" x2="300" y2="300" class="edge" />
                <line id="e34" x1="300" y1="300" x2="100" y2="300" class="edge" />
                <line id="e41" x1="100" y1="300" x2="100" y2="100" class="edge" />
                
                <circle id="n1" cx="100" cy="100" r="25" class="node" />
                <text x="100" y="100" class="node-text">1</text>
                
                <circle id="n2" cx="300" cy="100" r="25" class="node" />
                <text x="300" y="100" class="node-text">2</text>
                
                <circle id="n3" cx="300" cy="300" r="25" class="node" />
                <text x="300" y="300" class="node-text">3</text>
                
                <circle id="n4" cx="100" cy="300" r="25" class="node" />
                <text x="100" y="300" class="node-text">4</text>
            </svg>
            <div style="margin-top: 10px; font-size: 16px; color: #64748b;">Màu vàng: Đỉnh đang xét (top)</div>
        </div>

        <div class="panel info-panel">
            <div class="panel-title">Bước hiện tại: <span id="step-num">0</span></div>
            <div id="description" class="step-desc">
                Nhấn nút "Tiếp theo" để bắt đầu thuật toán từ đỉnh 1.
            </div>
        </div>

        <div class="panel data-panel">
            <div class="panel-title">Ngăn xếp (Stack)</div>
            <div id="stack-view" class="stack-container"></div>
            
            <div class="panel-title">Chu trình Euler (CE)</div>
            <div id="ce-view" class="ce-list"></div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevStep()" disabled>Quay lại</button>
        <button id="nextBtn" onclick="nextStep()">Tiếp theo</button>
    </div>
</div>

<script>
    const steps = [
        { 
            desc: "Khởi tạo: Chọn đỉnh 1 là đỉnh bắt đầu. Đưa 1 vào Ngăn xếp.",
            stack: [1], ce: [], activeNode: 1, removedEdges: []
        },
        { 
            desc: "Đỉnh 1 còn cạnh kề chưa đi là (1,2). Di chuyển sang 2. Đưa 2 vào Stack. Xóa cạnh (1,2).",
            stack: [1, 2], ce: [], activeNode: 2, removedEdges: ['e12']
        },
        { 
            desc: "Đỉnh 2 còn cạnh kề là (2,3). Di chuyển sang 3. Đưa 3 vào Stack. Xóa cạnh (2,3).",
            stack: [1, 2, 3], ce: [], activeNode: 3, removedEdges: ['e12', 'e23']
        },
        { 
            desc: "Đỉnh 3 còn cạnh kề là (3,4). Di chuyển sang 4. Đưa 4 vào Stack. Xóa cạnh (3,4).",
            stack: [1, 2, 3, 4], ce: [], activeNode: 4, removedEdges: ['e12', 'e23', 'e34']
        },
        { 
            desc: "Đỉnh 4 còn cạnh kề cuối cùng là (4,1). Di chuyển sang 1. Đưa 1 vào Stack. Xóa cạnh (4,1).",
            stack: [1, 2, 3, 4, 1], ce: [], activeNode: 1, removedEdges: ['e12', 'e23', 'e34', 'e41']
        },
        { 
            desc: "Đỉnh 1 hết cạnh kề. Lấy 1 ra khỏi Stack đưa vào danh sách CE.",
            stack: [1, 2, 3, 4], ce: [1], activeNode: 1, removedEdges: ['e12', 'e23', 'e34', 'e41']
        },
        { 
            desc: "Đỉnh 4 hết cạnh kề. Lấy 4 ra khỏi Stack đưa vào danh sách CE.",
            stack: [1, 2, 3], ce: [1, 4], activeNode: 4, removedEdges: ['e12', 'e23', 'e34', 'e41']
        },
        { 
            desc: "Đỉnh 3 hết cạnh kề. Lấy 3 ra khỏi Stack đưa vào danh sách CE.",
            stack: [1, 2], ce: [1, 4, 3], activeNode: 3, removedEdges: ['e12', 'e23', 'e34', 'e41']
        },
        { 
            desc: "Đỉnh 2 hết cạnh kề. Lấy 2 ra khỏi Stack đưa vào danh sách CE.",
            stack: [1], ce: [1, 4, 3, 2], activeNode: 2, removedEdges: ['e12', 'e23', 'e34', 'e41']
        },
        { 
            desc: "Đỉnh 1 hết cạnh kề. Lấy 1 ra khỏi Stack đưa vào danh sách CE. Stack rỗng -> Hoàn thành.",
            stack: [], ce: [1, 4, 3, 2, 1], activeNode: 1, removedEdges: ['e12', 'e23', 'e34', 'e41']
        }
    ];

    let currentStep = -1;

    function updateUI() {
        if (currentStep < 0) return;
        const s = steps[currentStep];

        // Update Text
        document.getElementById('step-num').innerText = currentStep + 1;
        document.getElementById('description').innerText = s.desc;

        // Update Graph
        for (let i = 1; i <= 4; i++) {
            document.getElementById('n' + i).classList.remove('active');
        }
        if (s.stack.length > 0) {
            document.getElementById('n' + s.activeNode).classList.add('active');
        }

        const edges = ['e12', 'e23', 'e34', 'e41'];
        edges.forEach(e => {
            if (s.removedEdges.includes(e)) {
                document.getElementById(e).classList.add('removed');
            } else {
                document.getElementById(e).classList.remove('removed');
            }
        });

        // Update Stack
        const stackView = document.getElementById('stack-view');
        stackView.innerHTML = '';
        s.stack.forEach(val => {
            const div = document.createElement('div');
            div.className = 'stack-item';
            div.innerText = val;
            stackView.appendChild(div);
        });

        // Update CE
        const ceView = document.getElementById('ce-view');
        ceView.innerHTML = '';
        s.ce.forEach(val => {
            const div = document.createElement('div');
            div.className = 'ce-item';
            div.innerText = val;
            ceView.appendChild(div);
        });

        // Buttons
        document.getElementById('prevBtn').disabled = currentStep <= 0;
        document.getElementById('nextBtn').disabled = currentStep >= steps.length - 1;
    }

    function nextStep() {
        if (currentStep < steps.length - 1) {
            currentStep++;
            updateUI();
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            updateUI();
        }
    }
</script>
</body>
</html>
