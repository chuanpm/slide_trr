<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Minh họa Thuật toán Euler Cycle - iSpring Ready</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #e2e8f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Ngăn chặn thanh cuộn ngoài cùng */
            font-family: 'Nunito Sans', sans-serif; 
        }
        
        .slide { 
            /* Tự động khớp với khung iSpring Web Object */
            width: 100%; 
            height: 100%;
            max-width: 1280px; 
            max-height: 720px;
            aspect-ratio: 16 / 9;
            
            background: white; 
            display: flex; 
            flex-direction: column; 
            padding: 2% 3%; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            position: relative;
            overflow: hidden;
        }
        
        h1 { 
            font-family: 'Montserrat', sans-serif; 
            font-size: clamp(20px, 3vw, 34px); 
            color: #1e293b; 
            border-bottom: 3px solid #4f46e5; 
            padding-bottom: 1%; 
            margin-bottom: 2%; 
        }
        
        .layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 2%;
            flex: 1;
            min-height: 0; /* Cho phép grid co lại bên trong flex */
        }

        .panel {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .panel-title {
            font-weight: 700;
            font-size: clamp(14px, 1.5vw, 18px);
            color: #4f46e5;
            margin-bottom: 10px;
            text-align: center;
        }

        .info-panel { text-align: left; }

        .step-desc {
            font-size: clamp(14px, 1.8vw, 20px);
            line-height: 1.4;
            color: #334155;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            border-left: 5px solid #4f46e5;
            height: 100%;
            overflow-y: auto; /* Cuộn bên trong nếu văn bản quá dài */
        }

        /* SVG RESPONSIVE */
        #graph-svg {
            width: 100%;
            height: auto;
            max-height: 280px;
        }

        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            width: 80px;
            border: 3px solid #1e293b;
            border-top: none;
            padding: 5px;
            flex-grow: 1;
            background: #fff;
            margin-bottom: 10px;
        }

        .stack-item {
            height: 30px;
            background: #4f46e5;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 3px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 16px;
        }

        .ce-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            max-height: 120px;
            overflow-y: auto;
        }

        .ce-item {
            width: 35px;
            height: 35px;
            background: #10b981;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 16px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-bottom: 10px;
        }

        button {
            padding: 8px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: #4f46e5;
            color: white;
            transition: 0.2s;
        }
        button:hover { background: #3730a3; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }

        .node.active { fill: #fde047; stroke: #4f46e5; stroke-width: 5; }
        .edge { stroke: #94a3b8; stroke-width: 4; }
        .edge.removed { stroke: #e2e8f0; stroke-dasharray: 5,5; }
        .node-text { font-weight: bold; font-size: 20px; text-anchor: middle; dominant-baseline: central; }
    </style>
</head>
<body>

<div class="slide">
    <h1>Minh họa Thuật toán Euler Cycle: Đồ thị 4 đỉnh</h1>
    
    <div class="layout">
        <div class="panel">
            <div class="panel-title">Đồ thị hiện tại</div>
            <svg viewBox="0 0 400 400" id="graph-svg">
                <line id="e12" x1="100" y1="100" x2="300" y2="100" class="edge" />
                <line id="e23" x1="300" y1="100" x2="300" y2="300" class="edge" />
                <line id="e34" x1="300" y1="300" x2="100" y2="300" class="edge" />
                <line id="e41" x1="100" y1="300" x2="100" y2="100" class="edge" />
                
                <circle id="n1" cx="100" cy="100" r="25" class="node" style="fill:#fff; stroke:#1e293b; stroke-width:3;" />
                <text x="100" y="100" class="node-text">1</text>
                
                <circle id="n2" cx="300" cy="100" r="25" class="node" style="fill:#fff; stroke:#1e293b; stroke-width:3;" />
                <text x="300" y="100" class="node-text">2</text>
                
                <circle id="n3" cx="300" cy="300" r="25" class="node" style="fill:#fff; stroke:#1e293b; stroke-width:3;" />
                <text x="300" y="300" class="node-text">3</text>
                
                <circle id="n4" cx="100" cy="300" r="25" class="node" style="fill:#fff; stroke:#1e293b; stroke-width:3;" />
                <text x="100" y="300" class="node-text">4</text>
            </svg>
        </div>

        <div class="panel info-panel">
            <div class="panel-title">Diễn giải (Bước <span id="step-num">0</span>)</div>
            <div id="description" class="step-desc">
                Nhấn "Tiếp theo" để bắt đầu.
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Stack & CE</div>
            <div id="stack-view" class="stack-container"></div>
            <div id="ce-view" class="ce-list"></div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevStep()" disabled>Quay lại</button>
        <button id="nextBtn" onclick="nextStep()">Tiếp theo</button>
    </div>
</div>

<script>

        { desc: "Bắt đầu: Đưa đỉnh 1 vào Stack.", stack: [1], ce: [], activeNode: 1, removedEdges: [] },
        { desc: "Đi tới đỉnh 2: Xóa cạnh (1,2), đưa 2 vào Stack.", stack: [1, 2], ce: [], activeNode: 2, removedEdges: ['e12'] },
        { desc: "Đi tới đỉnh 3: Xóa cạnh (2,3), đưa 3 vào Stack.", stack: [1, 2, 3], ce: [], activeNode: 3, removedEdges: ['e12', 'e23'] },
        { desc: "Đi tới đỉnh 4: Xóa cạnh (3,4), đưa 4 vào Stack.", stack: [1, 2, 3, 4], ce: [], activeNode: 4, removedEdges: ['e12', 'e23', 'e34'] },
