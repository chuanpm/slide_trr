<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Minh họa Thuật toán Euler Cycle - iSpring Ready</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #e2e8f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Nunito Sans', sans-serif; 
        }
        
        .slide { 
            width: 100%; 
            height: 100%;
            max-width: 1280px; 
            max-height: 720px;
            aspect-ratio: 16 / 9;
            
            background: white; 
            display: flex; 
            flex-direction: column; 
            padding: 2% 3%; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            position: relative;
            overflow: hidden;
        }
        
        h1 { 
            font-family: 'Montserrat', sans-serif; 
            font-size: clamp(20px, 3vw, 34px); 
            color: #1e293b; 
            border-bottom: 3px solid #4f46e5; 
            padding-bottom: 1%; 
            margin-bottom: 2%; 
        }
        
        .layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 2%;
            flex: 1;
            min-height: 0;
        }

        .panel {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .panel-title {
            font-weight: 700;
            font-size: clamp(14px, 1.5vw, 18px);
            color: #4f46e5;
            margin-bottom: 10px;
            text-align: center;
        }

        .info-panel { text-align: left; }

        .step-desc {
            font-size: clamp(14px, 1.8vw, 20px);
            line-height: 1.4;
            color: #334155;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            border-left: 5px solid #4f46e5;
            height: 100%;
            overflow-y: auto;
        }

        #graph-svg {
            width: 100%;
            height: auto;
            max-height: 280px;
        }

        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            width: 80px;
            border: 3px solid #1e293b;
            border-top: none;
            padding: 5px;
            flex-grow: 1;
            background: #fff;
            margin-bottom: 10px;
        }

        .stack-item {
            height: 30px;
            background: #4f46e5;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 3px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 16px;
        }

        .ce-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            max-height: 120px;
            overflow-y: auto;
        }

        .ce-item {
            width: 35px;
            height: 35px;
            background: #10b981;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 16px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-bottom: 10px;
        }

        button {
            padding: 8px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: #4f46e5;
            color: white;
            transition: 0.2s;
        }
        button:hover { background: #3730a3; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }

        .node { fill: #fff; stroke: #1e293b; stroke-width: 3; transition: all 0.3s; }
        .node.active { fill: #fde047; stroke: #4f46e5; stroke-width: 5; }
        .edge { stroke: #94a3b8; stroke-width: 4; transition: all 0.3s; }
        .edge.removed { stroke: #cbd5e1; stroke-opacity: 0.2; stroke-dasharray: 5,5; }
        .node-text { font-weight: bold; font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    </style>
</head>
<body>

<div class="slide">
    <h1>Minh họa Thuật toán Euler Cycle: Đồ thị 4 đỉnh</h1>
    
    <div class="layout">
        <div class="panel">
            <div class="panel-title">Đồ thị hiện tại</div>
            <svg viewBox="0 0 400 400" id="graph-svg">
                <line id="e12" x1="100" y1="100" x2="300" y2="100" class="edge" />
                <line id="e23" x1="300" y1="100" x2="300" y2="300" class="edge" />
                <line id="e34" x1="300" y1="300" x2="100" y2="300" class="edge" />
                <line id="e41" x1="100" y1="300" x2="100" y2="100" class="edge" />
                
                <circle id="n1" cx="100" cy="100" r="25" class="node" />
                <text x="100" y="100" class="node-text">1</text>
                
                <circle id="n2" cx="300" cy="100" r="25" class="node" />
                <text x="300" y="100" class="node-text">2</text>
                
                <circle id="n3" cx="300" cy="300" r="25" class="node" />
                <text x="300" y="300" class="node-text">3</text>
                
                <circle id="n4" cx="100" cy="300" r="25" class="node" />
                <text x="100" y="300" class="node-text">4</text>
            </svg>
        </div>

        <div class="panel info-panel">
            <div class="panel-title">Diễn giải (Bước <span id="step-num">0</span>)</div>
            <div id="description" class="step-desc">
                Nhấn "Tiếp theo" để bắt đầu mô phỏng thuật toán.
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Stack & CE</div>
            <div id="stack-view" class="stack-container"></div>
            <div id="ce-view" class="ce-list"></div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevStep()" disabled>Quay lại</button>
        <button id="nextBtn" onclick="nextStep()">Tiếp theo</button>
    </div>
</div>

<script>
    // Kịch bản mô phỏng từng bước của thuật toán tìm Chu trình Euler
    const steps = [
        { desc: "Khởi tạo: Chọn đỉnh xuất phát là 1. Đưa đỉnh 1 vào Stack.", stack: [1], ce: [], activeNode: 1, removedEdges: [] },
        { desc: "Từ đỉnh 1 có cạnh nối tới đỉnh 2. Đi tới đỉnh 2, xóa cạnh (1,2) khỏi đồ thị và đưa đỉnh 2 vào Stack.", stack: [1, 2], ce: [], activeNode: 2, removedEdges: ['e12'] },
        { desc: "Từ đỉnh 2 có cạnh nối tới đỉnh 3. Đi tới đỉnh 3, xóa cạnh (2,3) khỏi đồ thị và đưa đỉnh 3 vào Stack.", stack: [1, 2, 3], ce: [], activeNode: 3, removedEdges: ['e12', 'e23'] },
        { desc: "Từ đỉnh 3 có cạnh nối tới đỉnh 4. Đi tới đỉnh 4, xóa cạnh (3,4) khỏi đồ thị và đưa đỉnh 4 vào Stack.", stack: [1, 2, 3, 4], ce: [], activeNode: 4, removedEdges: ['e12', 'e23', 'e34'] },
        { desc: "Từ đỉnh 4 có cạnh nối tới đỉnh 1. Đi tiếp về đỉnh 1, xóa cạnh (4,1) khỏi đồ thị và đưa đỉnh 1 vào Stack.", stack: [1, 2, 3, 4, 1], ce: [], activeNode: 1, removedEdges: ['e12', 'e23', 'e34', 'e41'] },
        { desc: "Hiện tại đỉnh 1 không còn cạnh liên thuộc nào chưa đi qua (bị cô lập). Tiến hành lấy đỉnh 1 ra khỏi Stack và đưa vào danh sách kết quả CE.", stack: [1, 2, 3, 4], ce: [1], activeNode: 1, removedEdges: ['e12', 'e23', 'e34', 'e41'] },
        { desc: "Đỉnh top hiện tại là 4 cũng không còn cạnh nào chưa đi qua. Lấy đỉnh 4 ra khỏi Stack và đưa vào CE.", stack: [1, 2, 3], ce: [1, 4], activeNode: 4, removedEdges: ['e12', 'e23', 'e34', 'e41'] },
        { desc: "Tương tự, đỉnh top hiện tại là 3 không còn cạnh liên thuộc. Lấy đỉnh 3 ra khỏi Stack và đưa vào CE.", stack: [1, 2], ce: [1, 4, 3], activeNode: 3, removedEdges: ['e12', 'e23', 'e34', 'e41'] },
        { desc: "Lấy tiếp đỉnh 2 ra khỏi Stack và đưa vào CE do đỉnh 2 đã hết cạnh khả dụng.", stack: [1], ce: [1, 4, 3, 2], activeNode: 2, removedEdges: ['e12', 'e23', 'e34', 'e41'] },
        { desc: "Lấy đỉnh cuối cùng (đỉnh 1) ra khỏi Stack và đưa vào CE. Stack bây giờ đã rỗng.", stack: [], ce: [1, 4, 3, 2, 1], activeNode: 1, removedEdges: ['e12', 'e23', 'e34', 'e41'] },
        { desc: "Thuật toán kết thúc! Đảo ngược danh sách CE (hoặc đọc từ phải qua trái) ta được Chu trình Euler hoàn chỉnh: 1 → 2 → 3 → 4 → 1.", stack: [], ce: [1, 4, 3, 2, 1], activeNode: null, removedEdges: ['e12', 'e23', 'e34', 'e41'] }
    ];

    let currentStep = 0;

    function renderStep(index) {
        const step = steps[index];
        
        // 1. Cập nhật số bước và phần diễn giải văn bản
        document.getElementById('step-num').innerText = index;
        document.getElementById('description').innerText = step.desc;
        
        // 2. Cập nhật trạng thái các Đỉnh trên SVG
        for (let i = 1; i <= 4; i++) {
            const nodeEl = document.getElementById(`n${i}`);
            if (i === step.activeNode) {
                nodeEl.classList.add('active');
            } else {
                nodeEl.classList.remove('active');
            }
        }
        
        // 3. Cập nhật trạng thái các Cạnh trên SVG (Cạnh đã xóa sẽ mờ đi)
        const allEdges = ['e12', 'e23', 'e34', 'e41'];
        allEdges.forEach(edgeId => {
            const edgeEl = document.getElementById(edgeId);
            if (step.removedEdges.includes(edgeId)) {
                edgeEl.classList.add('removed');
            } else {
                edgeEl.classList.remove('removed');
            }
        });
        
        // 4. Cập nhật UI hiển thị Stack (Ngăn xếp)
        const stackView = document.getElementById('stack-view');
        stackView.innerHTML = '';
        step.stack.forEach(val => {
            const item = document.createElement('div');
            item.className = 'stack-item';
            item.innerText = val;
            stackView.appendChild(item);
        });
        
        // 5. Cập nhật UI hiển thị danh sách chu trình CE
        const ceView = document.getElementById('ce-view');
        ceView.innerHTML = '';
        step.ce.forEach(val => {
            const item = document.createElement('div');
            item.className = 'ce-item';
            item.innerText = val;
            ceView.appendChild(item);
        });
        
        // 6. Xử lý trạng thái các nút bấm (Bật/Tắt hợp lý)
        document.getElementById('prevBtn').disabled = (index === 0);
        document.getElementById('nextBtn').disabled = (index === steps.length - 1);
    }

    function nextStep() {
        if (currentStep < steps.length - 1) {
            currentStep++;
            renderStep(currentStep);
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            renderStep(currentStep);
        }
    }

    // Chạy render bước đầu tiên ngay khi tải trang xong
    window.onload = function() {
        renderStep(0);
    };
</script>
</body>
</html>
